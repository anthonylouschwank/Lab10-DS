# Tema basado en la escala de grises g10 de IBM Carbon. Los controles van en tinta
# oscura para que el azul, el naranja y el aqua queden reservados a las vias de ingreso.
[theme]
base = "light"
primaryColor = "#161616"
backgroundColor = "#f4f4f4"
secondaryBackgroundColor = "#e8e8e8"
textColor = "#161616"
linkColor = "#0f62fe"
borderColor = "#e0e0e0"
showWidgetBorder = true
baseRadius = "none"
font = "PlexSans, sans-serif"
headingFont = "PlexSans, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
codeFont = "PlexMono, monospace"
baseFontSize = 14

[[theme.fontFaces]]
family = "PlexSans"
url = "app/static/tipografia/IBMPlexSans.ttf"
weight = "100 700"
style = "normal"

[[theme.fontFaces]]
family = "PlexSans"
url = "app/static/tipografia/IBMPlexSans-Italic.ttf"
weight = "100 700"
style = "italic"

[[theme.fontFaces]]
family = "PlexMono"
url = "app/static/tipografia/IBMPlexMono-Regular.ttf"
weight = "400"

[[theme.fontFaces]]
family = "PlexMono"
url = "app/static/tipografia/IBMPlexMono-Medium.ttf"
weight = "500"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f4"
showSidebarBorder = true

[server]
headless = true
enableStaticServing = true

[client]
toolbarMode = "minimal"
